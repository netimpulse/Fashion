# Shopify CLI – Theme-Konfiguration Fashion
#
# development-Environment zeigt auf das UNPUBLISHED Test-Theme.
# CLI-Pushes gehen ausschliesslich hierhin — niemals ins MAIN-Theme.
# Customer sehen Test-Aenderungen NIE.

[environments.development]
store = "fashion-o4ccall8.myshopify.com"
theme = "148871282774"

# Production-Block ergaenzen, wenn an einen Kundenshop gepusht werden soll:
# [environments.production]
# store = "kunde-x.myshopify.com"
# theme = "..."

ignore = [
  "tests/**",
  "playwright.config.ts",
  "playwright/**",
  "qa-screenshots/**",
  "playwright-report/**",
  "test-results/**",
  "package.json",
  "package-lock.json",
  "node_modules/**",
  ".env*",
  ".gitignore",
  ".claude/**",
  ".mcp.json",
  "CLAUDE.md"
]
