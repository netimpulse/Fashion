# Shopify CLI – Theme-Konfiguration
#
# Das development-Environment zeigt auf das QA-Preview-Theme im
# Fashion-Dev-Store. Das Theme ist nicht GitHub-synchronisiert,
# es wird ausschliesslich via Shopify CLI aus der aktuellen
# Arbeits-Branch gepusht — damit der QA-Workflow auch auf
# PR-Branches funktioniert (Claude Code Web macht standardmaessig PRs).

[environments.development]
store = "fashion-dev-zekm0nfo.myshopify.com"
theme = "172338249764"

# Production-Block wird pro Kundenshop ergaenzt:
# [environments.production]
# store = "kunde-x.myshopify.com"
# theme = "__PROD_THEME_ID__"

ignore = [
  "templates/page.qa-*.json",
  "tests/**",
  "playwright.config.ts",
  "playwright/**",
  "qa-screenshots/**",
  "playwright-report/**",
  "test-results/**",
  "package.json",
  "package-lock.json",
  "node_modules/**",
  "README.md",
  ".env*",
  ".gitignore",
  ".claude/**",
  ".mcp.json"
]
